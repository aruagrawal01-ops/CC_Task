events {}

http {
    # Per-student rate limit; a scripted client gets 429 instead of starving everyone else.
    limit_req_zone $http_x_user_id zone=per_user:10m rate=10r/s;
    limit_req_status 429;
    # The seat map is the same for everyone and read constantly: cache it for 1s.
    proxy_cache_path /tmp/seatmap keys_zone=seatmap:1m max_size=10m;

    upstream api {
        server api:8000;   # Docker DNS returns every replica; nginx round-robins across them
        keepalive 32;
    }

    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        location = /seats {
            proxy_cache seatmap;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_pass http://api;
        }

        location / {
            limit_req zone=per_user burst=20 nodelay;
            proxy_pass http://api;
        }
    }
}
