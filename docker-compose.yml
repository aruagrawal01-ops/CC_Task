# Starts the database and the app together: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lastseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql   # creates the tables and 500 seats on first start
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lastseat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until the database is ready
